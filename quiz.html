<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Games | Квіз</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><strong>ROCKSTAR</strong></a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="info.html">Про ігри</a></li>
            <li><a href="quiz.html">Квіз</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="quiz-container">
        <h1 class="text1">Перевір свої знання Rockstar Games</h1>
        
        <div id="quiz-content" class="app-container">
            
            <div id="start-screen" class="screen">
                <p class="text2">Готовий довести, що ти справжній фанат?<br> У тебе буде 15 питань про історію та ігри компанії.</p>
                <div style="display: flex; justify-content: center; margin-top: 20px;">
                    <select id="choicDifficult">
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
                    <button id="startQuiz" class="main-btn">Почати квіз</button>
                </div>
            </div>

                    <div id="quiz-screen" class="screen disable hide"></div>
                    <h2 id="questionText"></h2>
                    <img id="questionImg" class="question-img" src="" alt="" />
                    <div id="options-container" class="options">
                        <p id="timerText"></p>
                        <ul id="answerList"></ul>
                        </div>
                </div>
                <button id="next-btn" style="display: none;">Наступне питання</button>
            </div>

            <div id="result-screen" class="screen disable hide">
                <h2>Твій результат:</h2>
                <p id="score-text"></p>
                <button onclick="location.reload()" class="main-btn">Спробувати ще раз</button>
            </div>

        </div>
    </section>
</main>

<script type="module" src="./js/quiz.js"></script>
</body>
</html>
