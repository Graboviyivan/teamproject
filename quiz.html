<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Games | Квіз</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><strong>ROCKSTAR</strong></a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="info.html">Про ігри</a></li>
            <li><a href="quiz.html">Квіз</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="app-container">
        <h1 class="text1">Перевір свої знання Rockstar Games</h1>
        
        <div id="start-screen" class="screen">
            <p class="main-title">Готовий довести, що ти справжній фанат?</p>
            <div class="controls">
                <select id="choicDifficult">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="startQuiz" class="main-btn">Почати квіз</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen disable">
            <h2 id="questionText"></h2>
            <img id="questionImg" class="quiz-image" src="" alt="Game Image" />
            <p id="timerText"></p>
            <ul id="answerList"></ul>
        </div>

        <div id="result-screen" class="screen disable">
            <h2 id="score-text" class="resultText"></h2>
            <button onclick="location.reload()" id="reloadBtn" class="main-btn">Спробувати ще раз</button>
        </div>
    </div>
</main>

<script src="./js/services/questions.js"></script>
</body>
</html>
