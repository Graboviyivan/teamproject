<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Games | Квіз</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><strong>ROCKSTAR</strong></a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="info.html">Про ігри</a></li>
            <li><a href="quiz.html">Квіз</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="app-container">
        <h1 class="text1">Перевір свої знання Rockstar Games</h1>
        
             <img class="question-img" src="" alt="" />
            <div id="start-screen" class="screen">
                <p class="main-title">Готовий довести, що ти справжній фанат?</p>
                    <select id="choicDifficult">
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
                    <button id="startQuiz" class="main-btn">Почати квіз</button>
                </div>
            

                    <div id="quiz-screen" class="screen disable hide">
                    <h2 id="questionText"></h2>
                    <img id="questionImg" class="question-img" src="" alt="" />
                        <p id="timerText"></p>
                        <ul id="answerList"></ul>
                        </div>
                </div>
                <div id="result-screen" class="screen disable hide"></div>
                
            </div>

                <button onclick="location.reload()" id="reloadBtn">Спробувати ще раз</button>
            

</main>

<script type="module" src="./js/services/questions.js"></script>
</body>
</html>
